name: Build Driver APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-8.5 gradle
          chmod +x gradle/bin/gradle

      - name: Build APK
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

          keytool -genkeypair -v -keystore release.keystore -alias golapi-driver \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pass1234 -keypass pass1234 \
            -dname "CN=Golapi Driver,O=MT Studio,L=Noakhali,C=BD" 2>/dev/null || true

          mkdir -p app/src/main/res/values app/src/main/res/mipmap-hdpi

          cat > settings.gradle << 'S'
          rootProject.name = 'GolapiDriver'
          include ':app'
          S

          cat > build.gradle << 'B'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B

          cat > gradle.properties << 'G'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          G

          cat > app/build.gradle << 'A'
          apply plugin: 'com.android.application'
          android {
              namespace 'online.golapishop.driver'
              compileSdk 34
              defaultConfig {
                  applicationId "online.golapishop.driver"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "pass1234"
                      keyAlias "golapi-driver"
                      keyPassword "pass1234"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.browser:browser:1.8.0'
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          A

          cat > app/src/main/AndroidManifest.xml << 'M'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Golapi Driver" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:theme="@style/AppTheme">
              <meta-data android:name="asset_statements" android:value='[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://www.golapishop.online"}}]'/>
              <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity" android:exported="true">
                <meta-data
